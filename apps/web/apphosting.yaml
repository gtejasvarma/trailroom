# Firebase App Hosting config. Schema per
# https://firebase.google.com/docs/app-hosting/configure (fetched 2026-10-06).
#
# Monorepo: the docs say to set the backend's "root directory" to the app (apps/web) when
# creating it (`firebase apphosting:backends:create`, or console "Deployment settings"), and
# that apphosting.yaml lives in that root directory, which is where this file is. The docs
# give no npm-workspaces or Turborepo-specific instructions beyond that, so it is unverified
# that App Hosting installs from the repo root (needed to resolve @trailroom/* workspace
# packages); confirm on the first real rollout.
runConfig:
  minInstances: 0
  maxInstances: 2
  memoryMiB: 1024
  cpu: 1
  # Render calls are long-lived I/O waits; 20 concurrent requests per 1 GiB instance leaves
  # headroom for image buffers. The docs' default is 80.
  concurrency: 20
  # Request timeout: runConfig has no timeout field (docs list cpu, memoryMiB, maxInstances,
  # minInstances, concurrency, cpuAlwaysAllocated only), so Cloud Run's default of 300 s applies
  # to /api/internal/pipeline/render-pose. The route sets maxDuration = 300 to match. If renders
  # ever need longer, raise the Cloud Run service timeout out of band (verify it survives rollouts).

env:
  # Secrets are Cloud Secret Manager names, never values.
  - variable: GEMINI_API_KEY
    secret: GEMINI_API_KEY
    availability:
      - RUNTIME
  - variable: GATE_PASSWORD
    secret: GATE_PASSWORD
    availability:
      - RUNTIME
  - variable: GATE_COOKIE_SECRET
    secret: GATE_COOKIE_SECRET
    availability:
      - RUNTIME
  # The owner's switch for the shared password. "off" (exactly) opens the whole site to anyone;
  # any other value, or removing this entry, puts the password gate back on at the next rollout.
  # Switched off by Tejas on 2026-10-11 with the list of what was owed first still open
  # (docs/decisions/0004 and BUILD_PLAN 12): the eval (M1), the legal review, real rate limiting.
  - variable: GATE
    value: "off"
    availability:
      - RUNTIME
  - variable: RENDER_MODEL
    value: nano-banana-2.1
  - variable: DAILY_CAP_USD
    value: "5"
  - variable: ORCHESTRATOR
    value: workflows

  # ---- Phase 5: graph, purge, storage. All values below are PLACEHOLDERS the deployer sets. ----
  # The app's default Cloud Storage bucket. Firebase projects created before late 2024 use
  # <project>.appspot.com, newer ones <project>.firebasestorage.app: set it to the project's real
  # default bucket. Garment images must be copied to gs://<bucket>/catalog/ BEFORE the first
  # rollout (the five files in packages/catalog/assets); in production a missing garment image
  # fails the job (internal) with no fallback.
  - variable: STORAGE_BUCKET
    value: virtual-tryon-tejas.firebasestorage.app
    availability:
      - RUNTIME
  # The app's public base URL, no trailing slash. It is the OIDC audience that /api/internal/*
  # requires, so it must equal the Cloud Workflow's APP_URL environment variable exactly.
  - variable: INTERNAL_AUDIENCE
    value: https://trailroom--virtual-tryon-tejas.us-central1.hosted.app
    availability:
      - RUNTIME
  # Email of the service account the workflow runs as; the only caller of the pipeline endpoints.
  - variable: WORKFLOWS_SA_EMAIL
    value: render-pose-set@virtual-tryon-tejas.iam.gserviceaccount.com
    availability:
      - RUNTIME
  # Email of the service account Cloud Scheduler uses; the only caller of /api/internal/purge.
  - variable: SCHEDULER_SA_EMAIL
    value: purge-guests@virtual-tryon-tejas.iam.gserviceaccount.com
    availability:
      - RUNTIME
  # Where the deployed workflow lives (the app starts executions with these).
  - variable: WORKFLOW_LOCATION
    value: us-central1
    availability:
      - RUNTIME
  - variable: WORKFLOW_NAME
    value: render-pose-set
    availability:
      - RUNTIME

  # How many proxies in front of the app append to x-forwarded-for; the client key is the entry
  # that many places from the RIGHT. Verify after deploy (docs/DEPLOY.md smoke test step 19): 31
  # requests for made-up ask tokens, each with a different made-up first hop in
  # x-forwarded-for, must end in a 429. Too low a number only
  # makes clients share a bucket; too high a number makes the limit spoofable.
  - variable: TRUSTED_PROXY_HOPS
    value: "1"
    availability:
      - RUNTIME
  # Extra origins the app may build links with, besides INTERNAL_AUDIENCE (comma-separated): the
  # custom domain. A share link is built on the address the person is using when it is one of
  # these; anything else falls back to INTERNAL_AUDIENCE.
  - variable: PUBLIC_ORIGINS
    value: https://trailroom.ai,https://www.trailroom.ai
    availability:
      - RUNTIME

  # ---- Phase G, the follow loop. Both switches are OFF until the owner decides. ----
  # May the "arrives on you" buffer render pieces nobody asked for? off (the default, and what
  # an absent value means) renders nothing unrequested. on lets the scheduled housekeeping call
  # pre-render up to five Front cards per signed-in person for new pieces from labels they
  # follow, only after they have seen the last five, only under DAILY_CAP_USD and the separate
  # ARRIVALS_DAILY_USD below. Any other value stops the app.
  - variable: ARRIVALS_BUFFER
    value: "off"
    availability:
      - RUNTIME
  # The most the buffer may spend in a UTC day (default 1; clamped to half of DAILY_CAP_USD, so
  # requested try-ons always keep at least half the day). It is
  # checked in the same transaction as the daily cap, so requested try-ons keep the rest.
  # - variable: ARRIVALS_DAILY_USD
  #   value: "1"
  #   availability:
  #     - RUNTIME
  # ---- The face check (services/face-match, see its README for the deploy steps). ----
  # FACE_MATCH_URL is the Cloud Run URL of trailroom-face-match, no trailing slash. Absent or empty
  # (the default) leaves the identity check skipped, exactly as before the service existed. With it
  # set, every render's face is compared with the person's own photo before it can be shown, and a
  # match probability below FACE_MATCH_MIN fails the pose. The app calls the service with a
  # Google-signed token, so the App Hosting runtime service account needs roles/run.invoker on it.
  - variable: FACE_MATCH_URL
    value: https://trailroom-face-match-zghitd3y5q-uc.a.run.app
    availability:
      - RUNTIME
  # The lowest match probability that still shows (default 0.50, the owner's rule of 2026-10-12).
  # - variable: FACE_MATCH_MIN
  #   value: "0.50"
  #   availability:
  #     - RUNTIME
  # How email leaves: none (the default) sends nothing, records nothing and hides every email
  # control and sentence in the product. Uncomment and set it when a provider transport exists;
  # "log" is for local dev and tests only and is refused in production.
  # - variable: EMAIL_TRANSPORT
  #   value: none
  #   availability:
  #     - RUNTIME
